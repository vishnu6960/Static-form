<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evergreen — Field notes on career, wealth &amp; habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Work+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    /* Brand (safe as identity color — never used to encode a comparison) */
    --forest:#16302A;
    --forest-2:#1F4038;
    --moss:#3E6259;
    --sand:#FBF6EC;
    --paper:#FFFFFF;
    --ink:#211C15;
    --ink-soft:#5B5749;
    --line:#E5DFCB;

    /* Okabe–Ito colorblind-safe accent pair — distinguishable across
       protanopia, deuteranopia, tritanopia and full monochromacy */
    --safe-blue:#0072B2;    /* used for: affirm / "Do" / primary action */
    --safe-vermillion:#D55E00; /* used for: caution / "Don't" */
    --safe-amber:#E69F00;   /* used for: highlight / eyebrow, never opposite blue */
    --safe-blue-bg:#E4F0F8;
    --safe-vermillion-bg:#FAEBE0;
    --safe-amber-bg:#FCF1DC;

    --radius:14px;
    --focus:3px solid #E69F00;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  h1,h2,h3,.display{font-family:'Newsreader',serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--safe-amber-bg);color:var(--forest);}
  :focus-visible{outline:var(--focus);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  /* ---------------- Top nav ---------------- */
  .topnav{position:sticky;top:0;z-index:60;background:var(--paper);border-bottom:1px solid var(--line);}
  .topnav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 24px;height:68px;}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0;}
  .brand-name{font-family:'Newsreader',serif;font-weight:600;font-size:21px;color:var(--forest);}
  .brand-tag{font-size:10.5px;color:var(--moss);text-transform:uppercase;letter-spacing:0.13em;font-weight:600;display:block;margin-top:1px;font-family:'Work Sans',sans-serif;}
  .nav-search{flex:1;max-width:360px;display:flex;align-items:center;background:var(--sand);border:1.5px solid var(--line);border-radius:24px;padding:0 14px;height:40px;}
  .nav-search input{background:transparent;border:none;outline:none;color:var(--ink);font-size:14px;width:100%;padding-left:8px;font-family:'Work Sans',sans-serif;}
  .nav-search input::placeholder{color:var(--ink-soft);}
  .nav-search svg{flex-shrink:0;color:var(--ink-soft);}
  .index-btn{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    background:var(--forest);color:#fff;border:none;border-radius:24px;
    padding:10px 18px;font-size:13.5px;font-weight:700;flex-shrink:0;
  }
  .index-btn:hover{background:var(--forest-2);}

  /* pill tabs */
  .pillbar{max-width:1280px;margin:0 auto;padding:16px 24px 0;display:flex;gap:10px;flex-wrap:wrap;}
  .pill{
    display:flex;align-items:center;gap:8px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);
    border-radius:24px;padding:8px 16px 8px 12px;font-size:13.5px;font-weight:600;
  }
  .pill svg{flex-shrink:0;}
  .pill.active{background:var(--forest);border-color:var(--forest);color:#fff;}
  .pill.active svg{color:#fff;}

  /* ---------------- Index drawer ---------------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(22,48,42,0.45);z-index:100;display:flex;justify-content:flex-end;}
  .drawer{width:min(420px,92vw);height:100%;background:var(--paper);box-shadow:-8px 0 30px rgba(0,0,0,0.15);padding:26px 24px;overflow-y:auto;}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .drawer-head h2{font-size:22px;color:var(--forest);margin:0;}
  .drawer-close{background:var(--sand);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .drawer-search{display:flex;align-items:center;gap:8px;background:var(--sand);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:18px;}
  .drawer-search input{border:none;background:none;outline:none;font-size:14px;width:100%;color:var(--ink);}
  .drawer-group{margin-bottom:18px;}
  .drawer-group-title{display:flex;align-items:center;gap:7px;font-size:11.5px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;color:var(--moss);margin-bottom:8px;}
  .drawer-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:10px 10px;border-radius:8px;font-size:14.5px;color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .drawer-item:hover{background:var(--sand);}

  /* ---------------- Shell ---------------- */
  .shell{max-width:1280px;margin:0 auto;padding:0 24px;}

  /* ---------------- Hero ---------------- */
  .hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;padding:44px 0 30px;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--safe-amber-bg);color:#8A6300;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;}
  .hero h1{font-size:40px;line-height:1.15;color:var(--forest);font-weight:600;margin:0 0 16px;max-width:560px;}
  .hero p{font-size:16px;color:var(--ink-soft);line-height:1.7;max-width:480px;margin:0 0 22px;}
  .hero-stats{display:flex;gap:26px;flex-wrap:wrap;}
  .hero-stat .n{font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:var(--forest);}
  .hero-stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .hero-visual{display:flex;align-items:center;justify-content:center;}

  /* ---------------- Category grid ---------------- */
  .grid-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 16px;}
  .grid-head h2{font-size:22px;color:var(--forest);margin:0;}
  .grid-head span{font-size:13px;color:var(--ink-soft);}
  .topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:50px;}
  .topic-card{
    background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;cursor:pointer;transition:box-shadow .15s, border-color .15s, transform .15s;
  }
  .topic-card:hover{border-color:var(--moss);box-shadow:0 8px 24px rgba(22,48,42,0.08);transform:translateY(-2px);}
  .topic-card-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .cat-chip{
    display:flex;align-items:center;gap:6px;background:var(--sand);border:1px solid var(--line);
    border-radius:16px;padding:4px 10px 4px 8px;font-size:11px;font-weight:700;color:var(--moss);
    text-transform:uppercase;letter-spacing:0.05em;
  }
  .field-note-no{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .topic-card h3{font-size:19px;color:var(--forest);margin:0 0 8px;font-weight:600;}
  .topic-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 12px;}
  .topic-card-foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--safe-blue);font-weight:700;}

  /* ---------------- Topic detail: two-column editorial ---------------- */
  .detail-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;padding:30px 0 70px;align-items:start;}
  .crumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .crumb button{background:none;border:none;color:var(--safe-blue);font-weight:600;font-size:12.5px;padding:0;}
  .fn-eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;font-weight:600;color:var(--moss);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;
  }
  .article-title{font-size:33px;font-weight:600;color:var(--forest);margin:0 0 14px;line-height:1.18;}
  .article-summary{font-size:16.5px;color:var(--ink-soft);line-height:1.68;margin:0 0 28px;}

  .stat-strip{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:30px;}
  .stat-pill{
    flex:1;min-width:150px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
    padding:16px 18px;display:flex;align-items:center;gap:12px;
  }
  .stat-pill .ico{width:34px;height:34px;border-radius:9px;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--forest);flex-shrink:0;}
  .stat-pill .val{font-family:'Newsreader',serif;font-size:19px;font-weight:600;color:var(--forest);line-height:1.1;}
  .stat-pill .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}

  /* Do/Don't — redundant coding: shape + icon + color + label, never color alone */
  .dodont{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px;}
  .dd-card{border-radius:var(--radius);padding:19px 21px;border-width:2px;border-style:solid;}
  .dd-card.do{background:var(--safe-blue-bg);border-color:#B7D6E9;}
  .dd-card.dont{background:var(--safe-vermillion-bg);border-color:#EFC7A8;}
  .dd-title{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;}
  .dd-title .badge{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dd-card.do .dd-title{color:#00508A;}
  .dd-card.dont .dd-title{color:#9E4600;}
  .dd-card ul{margin:0;padding:0;list-style:none;}
  .dd-card li{display:flex;gap:9px;font-size:13.8px;line-height:1.55;padding:6px 0;color:var(--ink);}
  .dd-card li svg{flex-shrink:0;margin-top:3px;}

  .body-copy{max-width:720px;}
  .body-copy h3{font-size:19px;color:var(--forest);margin:26px 0 10px;font-weight:600;}
  .body-copy p{font-size:15px;line-height:1.78;color:#31291E;margin:0 0 14px;}

  .disclaimer{
    font-size:12px;color:var(--ink-soft);border-left:3px solid var(--safe-amber);
    padding:9px 0 9px 14px;margin:24px 0 6px;background:var(--safe-amber-bg);line-height:1.6;border-radius:0 8px 8px 0;
  }

  /* ---------------- Right rail: Toolkit ---------------- */
  .rail{position:sticky;top:90px;display:flex;flex-direction:column;gap:16px;}
  .rail-card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px 18px;}
  .rail-card h4{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--moss);margin:0 0 10px;font-weight:700;}
  .related-link{display:block;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--forest);font-weight:600;}
  .related-link:last-child{border-bottom:none;}
  .ad-slot{
    border:1.5px dashed #CFC6A8;border-radius:12px;background:repeating-linear-gradient(135deg,#F3EEDD,#F3EEDD 10px,#EFE8D3 10px,#EFE8D3 20px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#9C9270;padding:22px 12px;
  }
  .ad-slot .ad-label{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;font-weight:700;color:#A4996E;margin-bottom:5px;}
  .ad-slot .ad-size{font-size:11px;color:#B2A783;}

  /* ---------------- Calculator (Toolkit instrument card) ---------------- */
  .calc-card{background:var(--forest);color:#fff;border-radius:16px;padding:24px 24px 26px;margin:6px 0 34px;}
  .calc-head{display:flex;align-items:center;gap:11px;margin-bottom:2px;}
  .calc-ring-mini{flex-shrink:0;}
  .calc-title{font-family:'Newsreader',serif;font-size:19px;font-weight:600;}
  .calc-sub{font-size:12.5px;color:rgba(255,255,255,0.62);margin:2px 0 20px;}
  .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-bottom:22px;}
  .calc-field label{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,0.75);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;}
  .calc-field label span.v{color:var(--safe-amber);font-family:'IBM Plex Mono',monospace;}
  .calc-field input[type=range]{width:100%;accent-color:var(--safe-amber);}
  .calc-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;}
  .calc-results{display:flex;flex-direction:column;gap:10px;}
  .calc-result{background:rgba(255,255,255,0.07);border-radius:9px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .calc-result .rv{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;color:var(--safe-amber);}
  .calc-result .rl{font-size:11px;color:rgba(255,255,255,0.68);text-transform:uppercase;letter-spacing:0.05em;text-align:right;}
  .calc-note{font-size:11.5px;color:rgba(255,255,255,0.5);margin-top:16px;line-height:1.55;}
  .ring-stage{display:flex;align-items:center;justify-content:center;}

  footer{background:var(--forest);color:rgba(255,255,255,0.65);text-align:center;padding:30px 20px;font-size:12px;line-height:1.75;}
  footer b{color:#fff;}
  .a11y-note{max-width:640px;margin:0 auto 14px;font-size:12px;color:rgba(255,255,255,0.55);}

  @media (max-width:960px){
    .hero{grid-template-columns:1fr;}
    .hero-visual{order:-1;}
    .topic-grid{grid-template-columns:1fr;}
    .detail-shell{grid-template-columns:1fr;}
    .rail{position:static;}
    .dodont{grid-template-columns:1fr;}
    .calc-grid{grid-template-columns:1fr;}
    .calc-body{grid-template-columns:1fr;}
    .nav-search{display:none;}
    .index-btn span.lbl{display:none;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect, useRef} = React;

/* ============================ DATA ============================ */

const CATEGORIES = [
  { id:"career", label:"Career & Work", icon:"briefcase", desc:"Steering a working life deliberately." },
  { id:"wealth", label:"Wealth & Investing", icon:"sprout", desc:"How money grows, slowly and then suddenly." },
  { id:"money", label:"Everyday Money", icon:"coins", desc:"The daily plumbing of personal finance." },
  { id:"habits", label:"Habits & Mindset", icon:"footprints", desc:"Small, repeatable choices that compound." },
];

const TOPICS = [
  {
    id:"career-learn", cat:"career", no:"01",
    title:"Choosing What to Learn Next",
    summary:"Not everything worth learning is worth learning right now — sequencing matters more than ambition.",
    stats:[
      {v:"1 skill", l:"Depth in one adjacent skill usually beats breadth across five"},
      {v:"90 days", l:"A realistic window to judge whether a new skill is worth continuing"},
    ],
    dos:[
      "Pick skills adjacent to what you're already good at — leverage compounds faster than novelty.",
      "Set a 90-day checkpoint before committing to a full year of study.",
      "Learn by building something real, not only by consuming courses.",
    ],
    donts:[
      "Don't learn five unrelated things at once — split focus rarely produces depth in any of them.",
      "Don't choose only by what's trending — durability matters more than hype.",
      "Don't wait for a formal course to begin — most skills can start with a small real project today.",
    ],
    body:[
      {h:"Sequencing beats ambition", p:"The question isn't whether a skill is valuable in the abstract — almost everything is, to someone. The question is what compounds fastest with what you already know, because a new skill layered on existing strength gets useful far sooner than one built from zero."},
    ],
  },
  {
    id:"career-negotiate", cat:"career", no:"02",
    title:"Reading the Room Before You Negotiate",
    summary:"Most negotiation advice focuses on what to say. The bigger lever is usually timing and context — knowing when leverage actually exists.",
    stats:[
      {v:"2 windows", l:"Leverage is highest at an offer stage or after a clear, documented win"},
    ],
    dos:[
      "Negotiate right after a clear win is fresh and documented, not months later from memory.",
      "Ask questions before making asks — understand budget constraints and timing first.",
      "Bring a specific, justified number rather than a vague 'more.'",
    ],
    donts:[
      "Don't negotiate during a hiring freeze or a bad quarter and expect the same leverage.",
      "Don't compare your situation to a colleague's as your main argument — it rarely lands well.",
      "Don't let a single 'no' end the conversation — ask what would need to be true to revisit it.",
    ],
    body:[
      {h:"Leverage is a moment, not a mood", p:"Confidence helps, but it doesn't create leverage that isn't there. Real leverage shows up at specific moments — a signed offer, a completed win, a budget cycle — and the skill is mostly in recognizing those moments rather than manufacturing confidence out of nothing."},
    ],
  },
  {
    id:"wealth-compound", cat:"wealth", no:"03",
    title:"The Mechanics of Compounding",
    summary:"Compounding isn't a strategy you choose — it's a property of time that rewards whoever stays in the game longest.",
    stats:[
      {v:"Time > Rate", l:"Doubling your years invested usually beats doubling your rate of return"},
      {v:"~6–10%", l:"Illustrative long-run range for diversified equity markets, before inflation"},
    ],
    dos:[
      "Start before you feel ready — the earliest years matter disproportionately.",
      "Reinvest returns instead of withdrawing them, especially early on.",
      "Judge growth over years and decades, not months.",
    ],
    donts:[
      "Don't interrupt compounding by moving money in and out chasing short-term news.",
      "Don't assume a single good or bad year says much about a decades-long plan.",
      "Don't treat any illustrative rate here as a promised return — markets vary and can lose value.",
    ],
    body:[
      {h:"Why the early years feel boring and matter most", p:"In the first stretch, compounding looks almost flat — gains are small in absolute terms. The visible acceleration comes later, built entirely on a base laid down during the unglamorous early years. Leaving early is the single most common way people miss it."},
    ],
    calculator:"rule72",
  },
  {
    id:"wealth-retire", cat:"wealth", no:"04",
    title:"Planning for Retirement, Roughly",
    summary:"You don't need a perfect forecast — you need a rough, honest number and a plan to close the gap to it.",
    stats:[
      {v:"~4%", l:"A commonly referenced starting-point withdrawal rate, not a guarantee"},
      {v:"Inflation", l:"The quiet factor that erodes a nominal number's real value over decades"},
    ],
    dos:[
      "Estimate in today's money, then adjust for inflation — nominal numbers alone mislead over decades.",
      "Revisit the plan every few years as income, goals, and markets shift.",
      "Separate 'essential' retirement income needs from 'nice to have' ones.",
    ],
    donts:[
      "Don't rely on a single fixed percentage forever — withdrawal needs shift with markets and health.",
      "Don't ignore inflation when comparing a distant target to today's cost of living.",
      "Don't delay starting because the full number feels intimidating — the early years matter most.",
    ],
    body:[
      {h:"Two numbers, not one", p:"A useful retirement plan tracks both a nominal target and its inflation-adjusted, 'real' equivalent. The nominal number motivates; the real number keeps expectations honest. The calculator alongside shows both."},
    ],
    calculator:"retirement",
  },
  {
    id:"money-borrow", cat:"money", no:"05",
    title:"Borrowing Wisely",
    summary:"Debt isn't inherently bad — the interest rate and what it's funding decide that, not the existence of the loan itself.",
    stats:[
      {v:"Rate matters", l:"The gap between a loan's rate and your expected investment return decides the trade-off"},
    ],
    dos:[
      "Compare the total cost of a loan (principal + interest), not just the monthly payment.",
      "Shop multiple lenders — a percentage point of rate difference compounds significantly over a long tenure.",
      "Understand prepayment terms before signing — some loans penalize paying early.",
    ],
    donts:[
      "Don't judge a loan only by whether the monthly payment 'feels' affordable.",
      "Don't borrow for depreciating purchases at high rates without a clear, considered reason.",
      "Don't ignore the amortization shape — early payments are mostly interest on many long loans.",
    ],
    body:[
      {h:"What a monthly payment hides", p:"Two loans with the same monthly payment can have very different total costs depending on rate and tenure. The sticker number people anchor on — the monthly payment — is the one number that least reflects what a loan actually costs overall."},
    ],
    calculator:"loan",
  },
  {
    id:"money-payfirst", cat:"money", no:"06",
    title:"Paying Yourself First",
    summary:"The order money moves in matters as much as how much there is — savings that happen last rarely happen at all.",
    stats:[
      {v:"1st, not last", l:"Where savings sit in the monthly order of operations"},
    ],
    dos:[
      "Automate a transfer to savings the day income arrives, before anything else.",
      "Treat that transfer like a fixed bill — non-negotiable, not a leftover.",
      "Start small and increase the amount gradually as it becomes routine.",
    ],
    donts:[
      "Don't wait to see 'what's left' at month's end — for most people, that number is zero.",
      "Don't set the automatic amount so high it forces you to cancel it within a month.",
      "Don't count debt paydown and savings as interchangeable without checking the interest rates involved.",
    ],
    body:[
      {h:"Order beats intention", p:"Nearly everyone intends to save. The people who actually do usually removed the decision entirely, by making saving the very first thing that happens to a paycheck rather than a choice made under month-end pressure."},
    ],
  },
  {
    id:"habits-small", cat:"habits", no:"07",
    title:"The Power of Small, Consistent Effort",
    summary:"A tiny daily edge, repeated, produces results that a single burst of intense effort almost never matches.",
    stats:[
      {v:"Repetition", l:"Matters more than intensity for most durable change"},
    ],
    dos:[
      "Choose a change small enough that skipping it feels almost silly.",
      "Track consistency (did I show up?) rather than only outcomes.",
      "Let the habit survive a bad day at reduced intensity rather than skipping entirely.",
    ],
    donts:[
      "Don't rely on a single burst of motivation to carry a year-long change.",
      "Don't set the daily bar so high that missing one day feels like failure.",

/* ---- Growth ring: magnitude encoded by RADIUS, not color ---- */
function GrowthRing({ value, max, size=160, stroke=10, label, sublabel, accent="var(--safe-amber)" }){
  const ref = useRef(null);
  const r = (size - stroke)/2;
  const c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(1, max>0 ? value/max : 0));
  const [dash, setDash] = useState(c);
  useEffect(()=>{
    const target = c*(1-pct);
    const id = requestAnimationFrame(()=>setDash(target));
    return ()=>cancelAnimationFrame(id);
  }, [pct, c]);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={label}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.14)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={accent} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={dash} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}
        style={{transition:"stroke-dashoffset 0.7s ease"}}/>
      <text x="50%" y="47%" textAnchor="middle" fontFamily="IBM Plex Mono, monospace" fontSize={size*0.13} fill="#fff" fontWeight="700">{label}</text>
      {sublabel && <text x="50%" y="63%" textAnchor="middle" fontFamily="Work Sans, sans-serif" fontSize={size*0.065} fill="rgba(255,255,255,0.6)">{sublabel}</text>}
    </svg>
  );
}

function Rule72Calculator(){
  const [rate, setRate] = useState(7);
  const years = rate>0 ? 72/rate : Infinity;
  return (
    <div className="calc-card">
      <div className="calc-head"><div className="calc-ring-mini"><IconCalcTool/></div><div className="calc-title">Time-to-Double (Rule of 72)</div></div>
      <div className="calc-sub">A quick mental-math estimate of how long a rate takes to double an amount.</div>
      <div className="calc-body">
        <div>
          <div className="calc-field">
            <label>Assumed annual rate <span className="v">{rate}%</span></label>
            <input type="range" min="1" max="20" step="0.5" value={rate} onChange={e=>setRate(+e.target.value)} />
          </div>
          <div className="calc-results" style={{marginTop:16}}>
            <div className="calc-result"><span className="rl">Years to double</span><span className="rv">{isFinite(years) ? years.toFixed(1) : "—"}</span></div>
            <div className="calc-result"><span className="rl">Doublings in 30 yrs</span><span className="rv">{isFinite(years) ? Math.floor(30/years) : "—"}</span></div>
          </div>
        </div>
        <div className="ring-stage">
          <GrowthRing value={20-rate} max={19} size={150} label={isFinite(years)?years.toFixed(1)+"y":"—"} sublabel="to double" accent="var(--safe-amber)"/>
        </div>
      </div>
      <div className="calc-note">Ring size reflects speed, not meaning conveyed by color — a smaller ring means a faster double. 72/rate is a well-known estimate, most accurate for rates roughly between 5–12%.</div>
    </div>
  );
}

function RetirementCalculator(){
  const [current, setCurrent] = useState(15000);
  const [monthly, setMonthly] = useState(400);
  const [rate, setRate] = useState(7);
  const [years, setYears] = useState(25);
  const [inflation, setInflation] = useState(3);

  const {nominal, real, monthlyIncome} = useMemo(()=>{
    const r = rate/100/12; const n = years*12;
    const fv = r>0 ? current*Math.pow(1+r,n) + monthly*((Math.pow(1+r,n)-1)/r) : current+monthly*n;
    const real = fv / Math.pow(1+inflation/100, years);
    const monthlyIncome = (fv*0.04)/12;
    return {nominal:fv, real, monthlyIncome};
  }, [current, monthly, rate, years, inflation]);

  return (
    <div className="calc-card">
      <div className="calc-head"><div className="calc-ring-mini"><IconCalcTool/></div><div className="calc-title">Retirement Corpus Calculator</div></div>
      <div className="calc-sub">Projects both the nominal total and its inflation-adjusted real value.</div>
      <div className="calc-grid">
        <div className="calc-field"><label>Current savings <span className="v">{fmt(current)}</span></label><input type="range" min="0" max="100000" step="500" value={current} onChange={e=>setCurrent(+e.target.value)} /></div>
        <div className="calc-field"><label>Monthly contribution <span className="v">{fmt(monthly)}</span></label><input type="range" min="0" max="3000" step="25" value={monthly} onChange={e=>setMonthly(+e.target.value)} /></div>
        <div className="calc-field"><label>Assumed return <span className="v">{rate}%</span></label><input type="range" min="1" max="12" step="0.5" value={rate} onChange={e=>setRate(+e.target.value)} /></div>
        <div className="calc-field"><label>Years to grow <span className="v">{years}</span></label><input type="range" min="1" max="45" step="1" value={years} onChange={e=>setYears(+e.target.value)} /></div>
        <div className="calc-field" style={{gridColumn:"1 / -1"}}><label>Assumed inflation <span className="v">{inflation}%</span></label><input type="range" min="0" max="8" step="0.5" value={inflation} onChange={e=>setInflation(+e.target.value)} /></div>
      </div>
      <div className="calc-results">
        <div className="calc-result"><span className="rl">Nominal value at target year</span><span className="rv">{fmt(nominal)}</span></div>
        <div className="calc-result"><span className="rl">Real value, today's money</span><span className="rv">{fmt(real)}</span></div>
        <div className="calc-result"><span className="rl">Sustainable monthly income (4% rule)</span><span className="rv">{fmt(monthlyIncome)}</span></div>
      </div>
      <div className="calc-note">Illustrative only — assumes a constant rate and the commonly cited 4% withdrawal guideline, neither of which is guaranteed. Not personalized financial advice.</div>
    </div>
  );
}

function LoanCalculator(){
  const [amount, setAmount] = useState(20000);
  const [rate, setRate] = useState(8);
  const [years, setYears] = useState(5);
  const {emi, totalPaid, totalInterest} = useMemo(()=>{
    const r = rate/100/12; const n = years*12;
    const emi = r>0 ? (amount*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1) : amount/n;
    const totalPaid = emi*n;
    return {emi, totalPaid, totalInterest: totalPaid-amount};
  }, [amount, rate, years]);
  const interestShare = totalPaid>0 ? totalInterest/totalPaid : 0;
  return (
    <div className="calc-card">
      <div className="calc-head"><div className="calc-ring-mini"><IconCalcTool/></div><div className="calc-title">Loan / EMI Calculator</div></div>
      <div className="calc-sub">Monthly payment and the true total cost of a fixed-rate loan.</div>
      <div className="calc-body">
        <div>
          <div className="calc-grid">
            <div className="calc-field" style={{gridColumn:"1 / -1"}}><label>Loan amount <span className="v">{fmt(amount)}</span></label><input type="range" min="1000" max="200000" step="500" value={amount} onChange={e=>setAmount(+e.target.value)} /></div>
            <div className="calc-field"><label>Interest rate <span className="v">{rate}%</span></label><input type="range" min="1" max="20" step="0.25" value={rate} onChange={e=>setRate(+e.target.value)} /></div>
            <div className="calc-field"><label>Tenure <span className="v">{years} yrs</span></label><input type="range" min="1" max="30" step="1" value={years} onChange={e=>setYears(+e.target.value)} /></div>
          </div>
          <div className="calc-results">
            <div className="calc-result"><span className="rl">Monthly payment</span><span className="rv">{fmt(emi)}</span></div>
            <div className="calc-result"><span className="rl">Total paid over term</span><span className="rv">{fmt(totalPaid)}</span></div>
            <div className="calc-result"><span className="rl">Of which is interest</span><span className="rv">{fmt(totalInterest)}</span></div>
          </div>
        </div>
        <div className="ring-stage">
          <GrowthRing value={interestShare*100} max={100} size={150} label={Math.round(interestShare*100)+"%"} sublabel="of total is interest" accent="var(--safe-vermillion)"/>
        </div>
      </div>
      <div className="calc-note">Assumes a fixed rate across the full term. Real loans may include fees, variable rates, or prepayment penalties — check the specific offer.</div>
    </div>
  );
}

function OnePercentCalculator(){
  const [days, setDays] = useState(365);
  const [rate, setRate] = useState(1);
  const gain = Math.pow(1+rate/100, days);
  const loss = Math.pow(1-rate/100, days);
  return (
    <div className="calc-card">
      <div className="calc-head"><div className="calc-ring-mini"><IconCalcTool/></div><div className="calc-title">"1% Better" Effort Calculator</div></div>
      <div className="calc-sub">The same small daily change, compounded — in the helpful direction and the harmful one.</div>
      <div className="calc-grid">
        <div className="calc-field"><label>Daily change <span className="v">±{rate}%</span></label><input type="range" min="0.25" max="5" step="0.25" value={rate} onChange={e=>setRate(+e.target.value)} /></div>
        <div className="calc-field"><label>Over how many days <span className="v">{days}</span></label><input type="range" min="7" max="730" step="1" value={days} onChange={e=>setDays(+e.target.value)} /></div>
      </div>
      <div className="calc-results" style={{flexDirection:"row", gap:12}}>
        <div className="calc-result" style={{flex:1, borderLeft:"3px solid var(--safe-blue)"}}><span className="rl">If +{rate}%/day, consistently</span><span className="rv">{gain.toFixed(gain>100?0:1)}×</span></div>
        <div className="calc-result" style={{flex:1, borderLeft:"3px solid var(--safe-vermillion)"}}><span className="rl">If −{rate}%/day, consistently</span><span className="rv">{loss.toFixed(3)}×</span></div>
      </div>
      <div className="calc-note">A simplified illustration of compounding applied to consistency of effort rather than money — real skill or habit growth isn't perfectly smooth or exponential, but the direction of the effect is real.</div>
    </div>
  );
}

          <p className="article-summary">{topic.summary}</p>

          {topic.stats && (
            <div className="stat-strip">
              {topic.stats.map((s,i)=>(
                <div className="stat-pill" key={i}>
                  <div className="ico"><IconStat/></div>
                  <div><div className="val mono">{s.v}</div><div className="lbl">{s.l}</div></div>
                </div>
              ))}
            </div>
          )}

          <div className="dodont">
            <div className="dd-card do">
              <div className="dd-title"><span className="badge"><IconDoBadge/></span>Do</div>
              <ul>{topic.dos.map((d,i)=><li key={i}><IconDoLi/>{d}</li>)}</ul>
            </div>
            <div className="dd-card dont">
              <div className="dd-title"><span className="badge"><IconDontBadge/></span>Don't</div>
              <ul>{topic.donts.map((d,i)=><li key={i}><IconDontLi/>{d}</li>)}</ul>
            </div>
          </div>

          {topic.calculator && <Calculator type={topic.calculator} />}

          <div className="body-copy">
            {topic.body.map((b,i)=>(
              <React.Fragment key={i}><h3>{b.h}</h3><p>{b.p}</p></React.Fragment>
            ))}
          </div>

          <div className="disclaimer">General information for educational purposes only — not personalized financial, legal, or career advice. Figures are illustrative. Consult a qualified professional for decisions specific to you.</div>
        </article>

        <aside className="rail">
          <div className="rail-card">
            <h4>Related field notes</h4>
            {related.map(t=>(
              <a className="related-link" key={t.id} href="#" onClick={e=>{e.preventDefault(); onSelect(t);}}>{t.no} — {t.title}</a>
            ))}
          </div>
          <div className="ad-slot" style={{minHeight:250}}><div className="ad-label">Advertisement</div><div className="ad-size">300 × 250</div></div>
          <div className="ad-slot" style={{minHeight:180}}><div className="ad-label">Advertisement</div><div className="ad-size">300 × 180</div></div>
        </aside>
      </div>
    </div>
  );
}

/* ============================ APP ============================ */

function App(){
  const [activeTopic, setActiveTopic] = useState(null);
  const [activeCat, setActiveCat] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [q, setQ] = useState("");

  const goHome = () => setActiveTopic(null);
  const select = (t) => { setActiveTopic(t); };

  return (
    <React.Fragment>
      <nav className="topnav">
        <div className="topnav-inner">
          <a className="brand" href="#" onClick={e=>{e.preventDefault(); goHome();}}>
            <LogoMark/>
            <span>
              <span className="brand-name">Evergreen</span>
              <span className="brand-tag">Career · Wealth · Habits</span>
            </span>
          </a>
          <div className="nav-search">
            <IconSearch/>
            <input placeholder="Search field notes…" value={q} onChange={e=>setQ(e.target.value)}
              onKeyDown={e=>{
                if(e.key==="Enter"){
                  const hit = TOPICS.find(t=>t.title.toLowerCase().includes(q.toLowerCase()));
                  if(hit) select(hit);
                }
              }}/>
          </div>
          <button className="index-btn" onClick={()=>setDrawerOpen(true)}><IconIndex/><span className="lbl">Full Index</span></button>
        </div>
      </nav>

      {activeTopic
        ? <TopicPage topic={activeTopic} onHome={goHome} onSelect={select}/>
        : <HomePage onSelect={select} activeCat={activeCat} setActiveCat={setActiveCat}/>
      }

      {drawerOpen && <IndexDrawer onClose={()=>setDrawerOpen(false)} onSelect={select}/>}

      <footer>
        <div className="a11y-note">
          Built with a colorblind-safe palette (Okabe–Ito blue/vermillion) and redundant coding — every signal pairs a color with a distinct shape, icon and label, so meaning never depends on color alone.
        </div>
        <b>Evergreen</b> — general knowledge, shared freely. No accounts, no tracking logins, no fees.<br/>
        Educational content only, not professional advice. © {new Date().getFullYear()} Evergreen.
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
